name: Terraform OPA Policy Check PR

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'inputs/**'
      - 'policies/**'
      - 'docs/**'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  policy_check:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'gcp/service/')
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44

      - name: Set up plugin cache config
        run: |
          bash scripts/auto_test/cache_setup.sh
 
      - name: Run policy checks (Terraform + OPA)
        id: policy-checks
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/auto_test/workflow_orchestrator.py

      - name: Add PR label based on policy check results
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_OUTCOME: ${{ steps.policy-checks.outcome }}
        run: |
          python3 scripts/auto_test/manage_pr_labels.py