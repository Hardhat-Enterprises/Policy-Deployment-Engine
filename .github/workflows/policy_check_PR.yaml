name: Terraform OPA Policy Check PR

on:
  workflow_dispatch:
  # NO paths filter, deliberately. Two reasons, and the second is the one that
  # bites:
  #
  #   * A change to scripts/ is the change most able to break every contributor at
  #     once — it is the harness they are all checked by — so it must not be the
  #     one change that runs no checks. Same for templates/, tests/ and the
  #     workflows themselves.
  #   * `lint` is a REQUIRED status check. GitHub does not treat a workflow that
  #     never ran as satisfied: it waits for a report that will never come, and the
  #     pull request cannot be merged at all. A paths filter here would therefore
  #     wedge every docs-only pull request — a Guide/ edit, a README fix — with a
  #     check that is not pending, not failing, just absent. A job skipped by its
  #     own `if:` (policy_check, below) reports "skipped" and does satisfy the
  #     requirement; a workflow filtered out by `paths:` reports nothing.
  #
  # The lint job is ~25s, so running it on every pull request is the cheaper half
  # of that trade by a wide margin.
  pull_request:
    types: [opened, synchronize, reopened]

# Least privilege by default; the policy_check job widens to pull-requests:write
# for labelling. The lint job needs only read.
permissions:
  contents: read

# Cancel superseded runs on the same PR (saves minutes and avoids the label step
# of an out-of-date run racing the current one).
concurrency:
  group: policy-check-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pin the engines so CI matches local runs (the provider itself is pinned via
  # scripts/auto_test/provider_version.txt). Bump these alongside the local tools.
  TERRAFORM_VERSION: "1.15.7"
  OPA_VERSION: "v1.17.1"

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, for two things run_precommit_linter.py needs: the
          # merge-base with the base branch (what did this PR change), and the
          # base branch's *tree*, which it checks out into a temporary git
          # worktree to work out which findings the PR introduced rather than
          # inherited. On a shallow clone the gate fails loudly rather than
          # blaming the contributor for the whole backlog — so this is
          # load-bearing, not an optimisation.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # Enforce the branch naming convention in CI (otherwise it is only checked by
      # the opt-in pre-commit hook, and a typo'd Service/ branch silently skips the
      # resource gate below).
      # What this pull request actually touches, so the steps below can skip work
      # that cannot be affected by it. Plain git rather than a marketplace action:
      # this is one `git diff` and it keeps the workflow's dependencies to the
      # official actions it already uses.
      #
      # Skipping a STEP is free of the trap that skipping a workflow has. A step
      # that does not run leaves its job green, and the job is what a required
      # check watches; a workflow filtered out by `paths:` reports nothing at all
      # and blocks the merge forever. That is why this logic lives here and not in
      # an `on: pull_request: paths:` block.
      - name: What changed
        id: changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_REF:-}" ]; then
            git fetch --quiet origin "$BASE_REF"
            files=$(git diff --name-only "origin/$BASE_REF...HEAD")
          else
            files=$(git ls-files)      # workflow_dispatch: treat everything as changed
          fi
          echo "$files" | grep -qE '^(docs|inputs|policies)/' && trees=true || trees=false
          echo "$files" | grep -qE '^(scripts|tests|templates)/' && tooling=true || tooling=false
          echo "trees=$trees"     >> "$GITHUB_OUTPUT"
          echo "tooling=$tooling" >> "$GITHUB_OUTPUT"
          echo "content trees changed: $trees | tooling changed: $tooling"

      - name: Validate branch name
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: python3 scripts/linters/check_branch_name.py --branch "$HEAD_REF"

      # Hard gate: the whole tree must stay structurally valid. Structural only
      # (--no-content-checks) on purpose — a whole-tree content gate would block
      # every PR on any repo-wide content regression; content is gated per-PR below.
      # Reconciliation is between docs/, inputs/ and policies/, so only a change to
      # one of them — or to the linter that judges them — can alter the verdict.
      - name: Structural lint (whole tree)
        if: steps.changed.outputs.trees == 'true' || steps.changed.outputs.tooling == 'true'
        run: python3 scripts/linters/linter.py --tree all --platform gcp --no-content-checks

      # Needed by two steps below: policy_lint.py (run by run_precommit_linter.py
      # for content-quality rules — hard-coded values, fixture drift — over the
      # resource types this PR touches) evaluates Rego, and 56 of the unit tests do
      # too. Both fail without `opa eval` on PATH — and both are skipped when
      # nothing they read has changed, so the download is skipped with them.
      - name: Install OPA
        if: steps.changed.outputs.trees == 'true' || steps.changed.outputs.tooling == 'true'
        env:
          OPA_VERSION: ${{ env.OPA_VERSION }}
        run: |
          curl -L -o opa "https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

      # The tools' own unit tests. They run here and nowhere else in CI, so without
      # this step a change to the linters or the harness could break all 269 of them
      # and still merge — and those are exactly the changes that reach every
      # contributor at once. After Install OPA because most of them evaluate Rego.
      # The tools test the tools; nothing under docs/ or inputs/ can break them.
      - name: Run the test suite
        if: steps.changed.outputs.tooling == 'true'
        run: |
          python3 -m pip install --quiet pytest
          python3 -m pytest -q

      # PR gate: structural + content checks (content is on by default), but only
      # fail on files this PR changed vs its base branch — never the repo-wide tree.
      # For policy_lint it narrows further: only findings this PR *introduced*,
      # measured against a throwaway worktree of the base tree.
      - name: Lint changed files (structural + content)
        if: github.event_name == 'pull_request' && steps.changed.outputs.trees == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Belt and braces with fetch-depth: 0 above — the base branch must be a
          # real local commit, because its tree is checked out and linted.
          git fetch --quiet origin "$BASE_REF"
          python3 scripts/linters/run_precommit_linter.py --base "origin/$BASE_REF"

  # Resource gate for Service/<platform>/<service_slug>/<resource_type> PRs: the
  # branch name identifies exactly one resource, and we enforce, scoped to it,
  # doc completeness (real true/false + rationale), true-arg policy+input coverage,
  # and the terraform-plan + OPA test.
  # Was its own workflow until the paths: filter came off this one. That filter
  # was the whole reason it lived separately — a branch whose only change was to
  # scripts/ or a stray binary would never have triggered this workflow, and this
  # check exists to catch exactly that. Now that this runs on every pull request,
  # a separate workflow buys nothing and costs a second queue wait and checkout.
  # The check name is unchanged ("Branch scope"): a status check's context is the
  # job name, not the workflow's.
  branch_scope:
    name: Branch scope
    runs-on: ubuntu-latest
    # feature/ branches and dev are out of this check's remit; the script agrees
    # (it exits 0 on a non-Service branch), but skipping the job keeps the PR
    # check list honest about what was actually evaluated.
    if: startsWith(github.head_ref, 'Service/')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                                   # need history for the merge-base
          # Check out the branch tip itself, not the PR's synthetic merge commit,
          # so the merge-base diff below is exactly the contributor's own changes.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      # Only the branch's own changes count: the diff is taken from the
      # merge-base with the base branch, so merging dev in to catch up never
      # registers as the contributor's edit.
      - name: Check branch scope
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref || 'dev' }}
        run: |
          git fetch --quiet origin "$BASE_REF"
          python3 scripts/linters/branch_scope.py \
            --branch "${HEAD_REF:-$GITHUB_REF_NAME}" \
            --base "origin/$BASE_REF"

  policy_check:
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'Service/')
    permissions:
      contents: read
      pull-requests: write    # gh pr edit --add-label / --remove-label
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false   # auto_test redirects `terraform show -json` to a file

      - name: Install OPA
        env:
          OPA_VERSION: ${{ env.OPA_VERSION }}
        run: |
          curl -L -o opa "https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

      - name: Set up plugin cache config
        run: bash scripts/auto_test/cache_setup.sh

      - name: Per-resource gate (doc completeness, coverage, OPA)
        id: policy-checks
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_resource.py --gate-only

      - name: Add PR label based on policy check results
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_OUTCOME: ${{ steps.policy-checks.outcome }}
        run: python3 scripts/auto_test/manage_pr_labels.py

  # ONE required status check, standing for the whole workflow.
  #
  # GitHub has no "require this workflow"; a required check is a single check run,
  # which means a single job. Naming lint and policy_check individually in the
  # ruleset works until someone adds a fourth job — which is then required by
  # nobody, silently. So the ruleset requires this job and nothing else, and every
  # job added below is covered the day it is written.
  #
  # `if: always()` and an explicit result test, NOT a bare `needs:`. A job whose
  # dependency was skipped is itself skipped, so without this the gate would vanish
  # on exactly the pull requests where policy_check and branch_scope skip — every
  # non-Service branch — and a vanished required check blocks the merge forever.
  #
  # `skipped` is a pass. A job that correctly decided it had nothing to do has not
  # failed, and treating it as failure would make the conditions above unusable.
  gate:
    name: PR checks
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, branch_scope, policy_check]
    steps:
      - name: Every check passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "  \(.key): \(.value.result)"'
          failed=$(echo "$RESULTS" | jq -r '
            to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | .key')
          if [ -n "$failed" ]; then
            echo "::error::these checks did not pass: $(echo $failed | tr "\n" " ")"
            exit 1
          fi
          echo "every check passed or was skipped"
