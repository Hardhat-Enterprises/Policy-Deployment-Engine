name: Terraform OPA Policy Check PR

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'inputs/**'
      - 'policies/**'
      - 'docs/**'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  policy_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44

      - name: Set up plugin cache config
        run: |
          bash scripts/auto_test/cache_setup.sh
 
      - name: Run policy checks (Terraform + OPA)
        id: policy-checks
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/auto_test/workflow_orchestrator.py

      - name: Add PR label based on policy check results
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.policy-checks.outcome }}" == "failure" ]; then
            echo "Policy checks failed - Adding CI-Review-Required label and removing CI-Approved"
            gh pr edit ${{ github.event.pull_request.number }} --remove-label "CI-Approved" 2>/dev/null || true
            gh pr edit ${{ github.event.pull_request.number }} --add-label "CI-Review-Required"
          else
            echo "Policy checks passed - Adding CI-Approved label and removing CI-Review-Required"
            gh pr edit ${{ github.event.pull_request.number }} --remove-label "CI-Review-Required" 2>/dev/null || true
            gh pr edit ${{ github.event.pull_request.number }} --add-label "CI-Approved"
          fi