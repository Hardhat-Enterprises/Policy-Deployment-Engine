name: Terraform OPA Policy Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'Policy-Deployment-Engine/inputs/**'
      - 'Policy-Deployment-Engine/policies/**'
      - 'Policy-Deployment-Engine/find_pairs.py'

jobs:
  policy_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

      - name: Run policy checks (Terraform + OPA)
        run: |
          python3 Policy-Deployment-Engine/find_pairs.py \
            --inputs Policy-Deployment-Engine/inputs/gcp \
            --policies Policy-Deployment-Engine/policies/gcp