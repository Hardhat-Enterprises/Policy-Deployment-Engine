name: Terraform OPA Policy Check ALL

on:
  workflow_dispatch:
    inputs:
      prune:
        description: "Prune plan-cache entries no fixture references (safe on this full scan)"
        type: boolean
        default: true

jobs:
  policy_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Lint (whole tree, structural + content)
        run: python3 scripts/linters/linter.py --tree all --platform gcp

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

      - name: Set up plugin cache config
        run: |
          bash scripts/auto_test/cache_setup.sh
 
      - name: Run policy checks (Terraform + OPA)
        run: |
          PRUNE=""
          if [ "${{ inputs.prune }}" = "true" ]; then PRUNE="--prune-plan-cache"; fi
          python3 scripts/auto_test/auto_test.py \
            --inputs inputs/gcp \
            --policies policies/gcp \
            --verbose $PRUNE