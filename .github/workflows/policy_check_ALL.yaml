name: Terraform OPA Policy Check ALL

on:
  workflow_dispatch:
  # Publish a fresh policy-results artifact on every push to dev so the
  # PDE Portal backend can consume the latest verdicts.
  push:
    branches:
      - dev

# Read-only: this is a full-tree verification run; it writes nothing back to the
# repo. The policy_results.json report is published as a build artifact, not committed.
permissions:
  contents: read

env:
  # Pin the engines so CI matches local runs (the provider is pinned via
  # scripts/auto_test/provider_version.txt). Bump alongside the local tools.
  TERRAFORM_VERSION: "1.15.7"
  OPA_VERSION: "v1.17.1"

jobs:
  policy_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Lint (whole tree, structural + content)
        run: python3 scripts/linters/linter.py --tree all --platform gcp

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false   # auto_test redirects `terraform show -json` to a file

      - name: Install OPA
        env:
          OPA_VERSION: ${{ env.OPA_VERSION }}
        run: |
          curl -L -o opa "https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

      # Content-quality rules (scripts/linters/policy_lint.py) over every documented
      # gcp resource — a repo-wide companion to the structural lint above, not a gate:
      # continue-on-error so a repo-wide content regression never reddens this job.
      # `--json gcp` is the whole-platform sweep (~11s; needs only OPA, no terraform
      # plan), so it must run after "Install OPA" above and needs nothing else set up.
      - name: Policy lint (whole tree, report only)
        continue-on-error: true
        run: |
          python3 scripts/linters/policy_lint.py --json gcp > policy-lint-report.json || true
          python3 - <<'EOF'
          import json
          from collections import Counter

          findings = json.load(open("policy-lint-report.json"))
          errors = sum(1 for f in findings if f["severity"] == "error")
          warns = len(findings) - errors
          print(f"policy_lint (whole tree): {errors} error(s), {warns} warning(s)")
          for rule, count in sorted(Counter(f["rule"] for f in findings).items()):
              print(f"  {rule}: {count}")
          EOF

      - name: Upload policy-lint report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: policy-lint-report
          path: policy-lint-report.json
          retention-days: 90
          if-no-files-found: warn

      # Best-effort provider mirror. The ALL run is designed to execute OFFLINE from
      # the committed plans (one <sha>.json per fixture dir): when every plan is
      # present, auto_test skips terraform entirely and this mirror is never touched.
      # So a registry hiccup here must NOT fail the job — auto_test still lazily builds
      # the cache itself (ensure_cache_ready) if a fixture ever misses. Don't add
      # `set -e` semantics: the `|| echo` keeps the step green when the registry is
      # unreachable.
      - name: Set up provider cache (best-effort; committed plans are the offline source)
        run: |
          bash scripts/auto_test/cache_setup.sh \
            || echo "⚠️  provider mirror unavailable — relying on the committed plans"

      # NOTE: a stale plan is pruned by the harness itself, in the fixture dir it
      # belongs to, as the replacement is written — there is no repo-wide prune step to
      # run here. Nothing this runner writes is committed back anyway: it is ephemeral
      # and this workflow has no commit/push step.
      # Only gcp carries fixtures/policies today (inputs/aws and inputs/azure are
      # empty), so a single gcp run already spans every provider the ALL run scans
      # and can write policy_results.json directly. When aws/azure gain fixtures,
      # run auto_test once per provider into provider-specific report files and
      # merge them here with `jq -s 'add' gcp.json aws.json azure.json > policy_results.json`.
      # --report is written before the step's non-zero exit, so the artifact upload
      # below (if: always()) still publishes results when policies fail.
      - name: Run policy checks (Terraform + OPA)
        run: |
          python3 scripts/auto_test/auto_test.py \
            --inputs inputs/gcp \
            --policies policies/gcp \
            --report policy_results.json \
            --verbose

      # Publish the machine-readable verdicts for the PDE Portal backend. Runs
      # even when the policy checks failed (the report is written first), under a
      # stable name so consumers can always fetch the latest.
      - name: Upload policy results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: policy-results
          path: policy_results.json
          retention-days: 90
          # `warn`, not `error`: this is a safety-net upload (if: always()). The report
          # is written on every path that runs auto_test to completion (pass or policy
          # failure), so a missing file means an upstream step already failed the job —
          # don't let this step manufacture a second, misleading failure.
          if-no-files-found: warn
