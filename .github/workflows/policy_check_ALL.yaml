name: Terraform OPA Policy Check ALL

on:
  workflow_dispatch:
  # Publish a fresh policy-results artifact on every push to dev so the
  # AutoCapstone backend can consume the latest verdicts.
  push:
    branches:
      - dev

# Read-only: this is a full-tree verification run; it writes nothing back to the
# repo. The policy_results.json report is published as a build artifact, not committed.
permissions:
  contents: read

env:
  # Pin the engines so CI matches local runs (the provider is pinned via
  # scripts/auto_test/provider_version.txt). Bump alongside the local tools.
  TERRAFORM_VERSION: "1.15.7"
  OPA_VERSION: "v1.17.1"

jobs:
  policy_check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Lint (whole tree, structural + content)
        run: python3 scripts/linters/linter.py --tree all --platform gcp

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false   # auto_test redirects `terraform show -json` to a file

      - name: Install OPA
        env:
          OPA_VERSION: ${{ env.OPA_VERSION }}
        run: |
          curl -L -o opa "https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x opa
          sudo mv opa /usr/local/bin/opa

      # Best-effort provider mirror. The ALL run is designed to execute OFFLINE from
      # the committed plan cache (inputs/plan_cache): when every plan is cached,
      # auto_test skips terraform entirely and this mirror is never touched. So a
      # registry hiccup here must NOT fail the job — auto_test still lazily builds the
      # cache itself (ensure_cache_ready) if a fixture ever misses. Don't add `set -e`
      # semantics: the `|| echo` keeps the step green when the registry is unreachable.
      - name: Set up provider cache (best-effort; plan cache is the offline source)
        run: |
          bash scripts/auto_test/cache_setup.sh \
            || echo "⚠️  provider mirror unavailable — relying on the committed plan cache"

      # NOTE: plan-cache pruning is intentionally NOT done here. The runner is
      # ephemeral and this workflow has no commit/push step, so any prune would be
      # discarded. Pruning is a local-maintainer operation:
      #   python3 scripts/auto_test/auto_test.py --inputs inputs/gcp \
      #       --policies policies/gcp --prune-plan-cache   # then commit the result
      # Only gcp carries fixtures/policies today (inputs/aws and inputs/azure are
      # empty), so a single gcp run already spans every provider the ALL run scans
      # and can write policy_results.json directly. When aws/azure gain fixtures,
      # run auto_test once per provider into provider-specific report files and
      # merge them here with `jq -s 'add' gcp.json aws.json azure.json > policy_results.json`.
      # --report is written before the step's non-zero exit, so the artifact upload
      # below (if: always()) still publishes results when policies fail.
      - name: Run policy checks (Terraform + OPA)
        run: |
          python3 scripts/auto_test/auto_test.py \
            --inputs inputs/gcp \
            --policies policies/gcp \
            --report policy_results.json \
            --verbose

      # Publish the machine-readable verdicts for the AutoCapstone backend. Runs
      # even when the policy checks failed (the report is written first), under a
      # stable name so consumers can always fetch the latest.
      - name: Upload policy results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: policy-results
          path: policy_results.json
          retention-days: 90
          # `warn`, not `error`: this is a safety-net upload (if: always()). The report
          # is written on every path that runs auto_test to completion (pass or policy
          # failure), so a missing file means an upstream step already failed the job —
          # don't let this step manufacture a second, misleading failure.
          if-no-files-found: warn
