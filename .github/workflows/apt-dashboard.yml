name: Automated Policy Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  push:
    paths:
      - 'docs/gcp/**'
      - 'scripts/service_status/**'
      - '.github/workflows/apt-dashboard.yml'

permissions:
  contents: write

jobs:
  build-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build APT dashboard
        run: python scripts/service_status/build_tracker.py

      - name: Commit and push dashboard updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(apt): update service status dashboard'
          file_pattern: 'docs/service-status/* scripts/service_status/resource_inventory.csv'
          branch: ${{ github.ref_name }}
