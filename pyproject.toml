# This project is NOT an installable package. Run the tools directly, e.g.
#   python scripts/docgen/generator.py ...
#   python scripts/linters/linter_v2.py ...
# This file exists only to record dependencies and configure pytest/coverage.
[project]
name = "policy-deployment-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "jsonschema>=4.0.0",
    "hypothesis>=6.0.0",
]
docgen = [
    "pyyaml>=6.0.0",
    "pydantic>=2.0.0",
]

[tool.pytest.ini_options]
# Tests live next to the tool they cover, in a `_tests/` dir
# (e.g. scripts/docgen/_tests/). importlib mode keeps same-named test
# files across different tools from colliding.
testpaths = ["scripts"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--import-mode=importlib",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["scripts"]
omit = [
    "*/_tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    ".venv/*",
    "venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "jsonschema>=4.25.1",
]
