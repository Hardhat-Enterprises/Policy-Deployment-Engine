<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Repo Contents</title>
  </head>
  <body>
    <script>
      (async () => {
        try {
          const response = await fetch('https://api.github.com/repos/Hardhat-Enterprises/Policy-Deployment-Engine/contents/');
          if (!response.ok) throw new Error('Network response was not ok');
          const data = await response.json();
          let htmlString = '<ul>';
          for (let file of data) {
            htmlString += `<li><a href="https://github.com/Hardhat-Enterprises/Policy-Deployment-Engine/blob/main/${file.path}" target="_blank">${file.name}</a></li>`;
          }
          htmlString += '</ul>';
          document.body.innerHTML = htmlString;
        } catch (error) {
          document.body.innerHTML = `<p>Error: ${error.message}</p>`;
        }
      })()
    </script>
  </body>
</html>
