    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem 1.25rem 3rem;
    }
    .container { max-width: 1100px; margin: 0 auto; }
    h1 {
      text-align: center;
      margin: 0 0 0.35rem;
      font-size: 2rem;
      color: #343a40;
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      margin: 0 0 1.75rem;
      font-size: 0.95rem;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.1rem;
      text-align: center;
    }
    .stat-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.2;
    }
    .stat-label {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      margin-bottom: 1rem;
    }
    .toolbar input {
      flex: 1 1 260px;
      padding: 0.65rem 0.9rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }
    .toolbar select {
      padding: 0.65rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.95rem;
      background: #fff;
    }
    .meta {
      color: var(--muted);
      font-size: 0.85rem;
      margin-left: auto;
    }
    details.service {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 0.65rem;
      overflow: hidden;
    }
    details.service[open] {
      border-color: #cfe2ff;
      box-shadow: 0 2px 8px rgba(0, 123, 255, 0.08);
    }
    summary {
      list-style: none;
      cursor: pointer;
      padding: 0.9rem 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      align-items: center;
    }
    summary::-webkit-details-marker { display: none; }
    .service-name {
      font-weight: 600;
      flex: 1 1 220px;
    }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: var(--accent-soft);
      color: #0b5ed7;
      font-size: 0.8rem;
      font-weight: 600;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.92rem;
    }
    th, td {
      padding: 0.55rem 1rem;
      border-top: 1px solid var(--border);
      text-align: left;
    }
    th {
      background: #f1f3f5;
      color: #495057;
      font-weight: 600;
    }
    tr:hover td { background: #fafbfc; }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 2rem 1rem;
      display: none;
    }
    .footer {
      margin-top: 1.5rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .footer a { color: var(--accent); }
    @media (max-width: 640px) {
      body { padding: 1.25rem 0.75rem 2rem; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>

  <script>
    const inventory = JSON.parse(document.getElementById('inventory-data').textContent);
    const servicesRoot = document.getElementById('services');
    const searchInput = document.getElementById('search');
    const sortSelect = document.getElementById('sort');
    const emptyState = document.getElementById('empty-state');

    function compareServices(a, b, mode) {
      switch (mode) {
        case 'name-desc':
          return b.name.localeCompare(a.name);
        case 'resources-desc':
          return b.resource_count - a.resource_count || a.name.localeCompare(b.name);
        case 'attributes-desc':
          return b.total_attributes - a.total_attributes || a.name.localeCompare(b.name);
        default:
          return a.name.localeCompare(b.name);
      }
    }

    function matchesFilter(service, query) {
      if (!query) return true;
      const q = query.toLowerCase();
      if (service.name.toLowerCase().includes(q)) return true;
      return service.resources.some(r => r.name.toLowerCase().includes(q));
    }

    function render() {
      const query = searchInput.value.trim();
      const mode = sortSelect.value;
      const filtered = inventory.services
        .filter(service => matchesFilter(service, query))
        .sort((a, b) => compareServices(a, b, mode));

      servicesRoot.innerHTML = filtered.map(service => `
        <details class="service">
          <summary>
            <span class="service-name">${service.name}</span>
            <span class="badge">${service.resource_count} resources</span>
            <span class="badge">${service.total_attributes} attributes</span>
          </summary>
          <table>
            <thead>
              <tr><th>Resource</th><th>Attributes</th></tr>
            </thead>
            <tbody>
              ${service.resources.map(resource => `
                <tr>
                  <td>${resource.name}</td>
                  <td>${resource.attributes}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </details>
      `).join('');

      emptyState.style.display = filtered.length ? 'none' : 'block';
    }

    searchInput.addEventListener('input', render);
    sortSelect.addEventListener('change', render);
    render();
  </script>
