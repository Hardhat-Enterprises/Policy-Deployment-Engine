repos:
  - repo: local
    hooks:
      - id: policy-linter
        name: Policy Linter (Multi-CSP)
        entry: python scripts/linters/run_precommit_linter.py
        language: system
        pass_filenames: false
        always_run: true
        files: ^(policies|inputs)/
      - id: branch-name-check
        name: Branch Naming Convention
        entry: python scripts/linters/check_branch_name.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]