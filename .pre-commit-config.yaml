# Pre-commit hooks for the Policy Deployment Engine.
# Install once per clone:  pre-commit install
#
# - policy-linter runs scripts/linters/run_precommit_linter.py, which lints the
#   whole tree but only FAILS on errors in the files you changed (this commit),
#   so you are never blocked by the repo-wide backlog. For policy_lint findings
#   it goes further and only fails on the ones this commit INTRODUCED, measured
#   against HEAD, so a file that was already messy does not become your problem.
# - branch-name-check enforces the branch naming convention.
# - branch-scope-check keeps a Service/ branch to its own resource's files. It
#   runs with --staged so it sees what you are about to commit, which is where a
#   stray `git add .` gets caught — before it is ever pushed.
# - resource-gate runs the per-resource checks that make sense at commit time:
#   doc completeness, and the OPA test when there is something to run it on.
#   --gate-only because the three hooks above already cover the rest of
#   scripts/check_resource.py.
#
#   --skip-coverage: true-arg coverage is NEVER a commit-time check. Coverage asks
#   "is this resource finished?" — every security_impact: true argument has a policy
#   and a fixture — and the workflow is docs first: a student writes the doc and gets
#   it approved before a single policy exists, so every commit in that phase has
#   gaps by design. The PR (policy_check_PR.yaml) and the full
#   `python scripts/check_resource.py` run enforce it. The OPA test is skipped along
#   with it, since without coverage it would fail on the missing policies and
#   fixtures rather than on anything the commit did. Deliberately not "skip only on
#   docs-only commits": guessing intent from which files a commit touches breaks
#   across real workflows, so the rule is fixed.
#
#   --changed-only keeps it off the critical path of a commit that has nothing to
#   do with the resource: the gate reads the resource's docs JSON, fixtures and
#   policies, so a commit touching none of them cannot change its verdict.
#
#   --if-cached stays as a guard in case the OPA test is ever re-enabled here: a
#   fixture you just edited has no committed plan, building one means running
#   terraform (on a fresh clone, a 121MB provider download), and a git hook may not
#   do minutes of network to you. With --skip-coverage the OPA test does not run.
#
# They all do their own git inspection, so pass_filenames is false and always_run
# is true (the script decides whether there is anything to check).
repos:
  - repo: local
    hooks:
      - id: policy-linter
        name: Policy / docs / inputs linter
        entry: python scripts/linters/run_precommit_linter.py
        language: system
        pass_filenames: false
        always_run: true
      - id: branch-name-check
        name: Branch naming convention
        entry: python scripts/linters/check_branch_name.py
        language: system
        pass_filenames: false
        always_run: true
      - id: branch-scope-check
        name: Branch scope (own resource only)
        entry: python scripts/linters/branch_scope.py --staged
        language: system
        pass_filenames: false
        always_run: true
      - id: resource-gate
        name: Resource gate (doc completeness)
        entry: python scripts/check_resource.py --gate-only --if-cached --changed-only --skip-coverage
        language: system
        pass_filenames: false
        always_run: true
