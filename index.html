<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Docs/GCP Contents</title>
  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #f8f9fa;
      margin: 0;
      padding: 2rem;
      color: #212529;
    }

    h1 {
      text-align: center;
      margin-bottom: 1rem;
      font-size: 2rem;
      color: #343a40;
    }

    .search-container {
      display: flex;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .search-container input {
      width: 60%;
      max-width: 500px;
      padding: 0.6rem 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
    }

    ul {
      list-style-type: none;
      padding: 0;
      max-width: 700px;
      margin: 0 auto;
    }

    li {
      margin: 0.5rem 0;
      padding: 0.8rem 1rem;
      background: #ffffff;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    li:hover {
      background: #f1f3f5;
      transform: translateX(5px);
    }

    a {
      text-decoration: none;
      color: #007bff;
      font-weight: 500;
    }

    a:hover {
      text-decoration: underline;
    }

    .error {
      color: red;
      text-align: center;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <h1>Docs/GCP Contents</h1>
  
  <div class="search-container">
    <input type="text" id="searchBox" placeholder="Search files...">
  </div>

  <ul id="fileList"></ul>

  <script>
    (async () => {
      try {
        const branch = "documentation/initialstructure"; // 👈 change this
        const url = `https://api.github.com/repos/Hardhat-Enterprises/Policy-Deployment-Engine/git/trees/${branch}?recursive=1`;

        const response = await fetch(url);
        if (!response.ok) throw new Error('Network response was not ok');
        const data = await response.json();

        // Get only files inside docs/gcp/
        const files = data.tree.filter(item => 
          item.path.startsWith("docs/gcp/") && item.type === "blob"
        );

        let htmlString = "";
        let level1Count = 0;

        // Top-level only (limit 2)
        const topLevel = [...new Set(files.map(f => f.path.split("/")[2]))];
        for (let folder of topLevel.slice(0, 2)) {
          htmlString += `<li><strong>${folder}</strong></li>`;

          // Sub-files inside that folder (limit 2)
          const subFiles = files.filter(f => f.path.split("/")[2] === folder).slice(0, 2);
          for (let subFile of subFiles) {
            let displayName = subFile.path.endsWith(".md")
              ? subFile.path.split("/").pop().slice(0, -3)
              : subFile.path.split("/").pop();
            let cleanPath = subFile.path.endsWith(".md")
              ? subFile.path.slice(0, -3)
              : subFile.path;

            htmlString += `<li style="margin-left:20px;"><a href="/Policy-Deployment-Engine/${cleanPath}" target="_blank">${displayName}</a></li>`;
          }
          level1Count++;
        }

        document.getElementById("fileList").innerHTML = htmlString;

        // 🔍 Search filter
        const searchBox = document.getElementById("searchBox");
        searchBox.addEventListener("input", function () {
          const filter = searchBox.value.toLowerCase();
          const items = document.querySelectorAll("#fileList li");
          items.forEach(item => {
            const text = item.textContent.toLowerCase();
            item.style.display = text.includes(filter) ? "" : "none";
          });
        });

      } catch (error) {
        document.body.innerHTML += `<p class="error">Error: ${error.message}</p>`;
      }
    })()
  </script>
</body>
</html>
