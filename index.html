<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Docs/GCP Contents</title>
  </head>
  <body>
    <h1>Docs/GCP Contents</h1>
    <script>
      (async () => {
        try {
          const branch = "documentation/initialstructure"; // 👈 change this
          const path = "docs/gcp";
          const url = `https://api.github.com/repos/Hardhat-Enterprises/Policy-Deployment-Engine/contents/${path}?ref=${branch}`;

          const response = await fetch(url);
          if (!response.ok) throw new Error('Network response was not ok');

          const data = await response.json();
          let htmlString = '<ul>';
          let level1Count = 0;

          for (let file of data) {
            if (level1Count >= 2) break;
            htmlString += `<li><a href="/Policy-Deployment-Engine/${file.path}" target="_blank">${file.name}</a></li>`;

            const suburl = `https://api.github.com/repos/Hardhat-Enterprises/Policy-Deployment-Engine/contents/${file.path}?ref=${branch}`;
            const subResponse = await fetch(suburl);
            if (!subResponse.ok) throw new Error('Network response was not ok');

            const subData = await subResponse.json();
            let level2Count = 0;

            for (let subFile of subData) {
              if (level2Count >= 2) break;

              // remove ".md" from display name and path
              let displayName = subFile.name.endsWith(".md") 
                ? subFile.name.slice(0, -3) 
                : subFile.name;
              let cleanPath = subFile.path.endsWith(".md") 
                ? subFile.path.slice(0, -3) 
                : subFile.path;

              htmlString += `<li><a href="/Policy-Deployment-Engine/${cleanPath}" target="_blank">${displayName}</a></li>`;
              level2Count++;
            }
            level1Count++;
          }
          htmlString += '</ul>';
          document.body.innerHTML += htmlString;
        } catch (error) {
          document.body.innerHTML += `<p>Error: ${error.message}</p>`;
        }
      })()
    </script>
  </body>
</html>
